name: Enterprise AI Knowledge Integration CI (Enhanced)

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    services:
      db:
        image: ankane/pgvector
        env:
          POSTGRES_USER: wiki_user
          POSTGRES_PASSWORD: wiki_password
          POSTGRES_DB: wiki_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r enterprise-ai-knowledge-integration/requirements.txt
        pip install pytest httpx pytest-asyncio pytest-cov

    - name: Run Webhook & Vectorization Tests (pgvector Integration)
      env:
        DATABASE_URL: postgresql://wiki_user:wiki_password@localhost:5432/wiki_db
        PYTHONPATH: ${{ github.workspace }}/enterprise-ai-knowledge-integration
      run: |
        cd enterprise-ai-knowledge-integration
        pytest --cov=src --cov=webhook_server --junitxml=test-results.xml tests/

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: enterprise-ai-knowledge-integration/test-results.xml

    - name: Upload Coverage Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: enterprise-ai-knowledge-integration/.coverage
